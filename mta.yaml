_schema-version: "3.2.0"
ID: supplierportal
version: 0.0.1

parameters:
  enable-parallel-deployments: true

modules:
  # 1) Creates the destinations (app repo, xsuaa, mail service) used by the approuter
  - name: supplierportal-destination-content
    type: com.sap.application.content
    requires:
      - name: supplierportal-auth
        parameters:
          service-key:
            name: supplierportal-auth-key
      - name: supplierportal-repo-host
        parameters:
          service-key:
            name: supplierportal-repo-host-key
      - name: supplierportal-destination-service
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: supplierportal_html_repo_host
              ServiceInstanceName: supplierportal-html5-service
              ServiceKeyName: supplierportal-repo-host-key
              sap.cloud.service: supplierportal
            - Name: supplierportal_uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: supplierportal-xsuaa-service
              ServiceKeyName: supplierportal-auth-key
              sap.cloud.service: supplierportal
            # NOTE: the mail destination (supplierportal_mail_srv) is NOT here.
            # It is created in the destination service resource below (init_data),
            # because the content deployer asks for ServiceInstanceName on it.
    build-parameters:
      no-source: true

  # 2) The UI5 app (built with npm run build:cf, produces dist/supplierportal.zip)
  - name: supplierportal
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # 3) The mail service (mail-srv/server.js)
  - name: supplierportal-mail-srv
    type: nodejs
    path: mail-srv
    parameters:
      memory: 256M
      disk-quota: 512M
    provides:
      - name: mail-srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: supplierportal-auth                # same xsuaa, so the forwarded token is accepted
      - name: supplierportal-smtp-credentials    # SMTP login details

  # 4) Uploads the built app zip to the HTML5 repository
  - name: supplierportal-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: supplierportal-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - supplierportal.zip
          name: supplierportal
          target-path: resources/

resources:
  - name: supplierportal-auth
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      config:
        xsappname: supplierportal    # must stay the same as the already deployed one
      service: xsuaa
      service-name: supplierportal-xsuaa-service
      service-plan: application

  - name: supplierportal-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: supplierportal-html5-service
      service-plan: app-host

  - name: supplierportal-destination-service
    type: org.cloudfoundry.managed-service
    requires:
      - name: mail-srv-api            # gives us the mail app URL
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              # Mail service destination (used by the /mail-api route in xs-app.json).
              # The user's token is forwarded to the mail app.
              - Authentication: NoAuthentication
                Name: supplierportal_mail_srv
                ProxyType: Internet
                Type: HTTP
                URL: ~{mail-srv-api/srv-url}
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: supplierportal-destination-service
      service-plan: lite

  # Existing user-provided service with the SMTP login details.
  # Create it once with:  cf cups supplierportal-smtp-credentials -t supplierportal-smtp-credentials -p '{...}'
  - name: supplierportal-smtp-credentials
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: supplierportal-smtp-credentials